<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Acesso restrito · Apresentação executiva · Sr. Jorge</title>
<style>
  :root { color-scheme: light; font-family: "Jost", "Segoe UI", Arial, sans-serif; }
  * { box-sizing: border-box; }
  @font-face { font-family: "Bebas Neue"; src: url("assets/fonts/BebasNeue-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald-VariableFont_wght.ttf") format("truetype"); font-weight: 200 700; font-display: block; }
  @font-face { font-family: "Jost"; src: url("assets/fonts/Jost-VariableFont_wght.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
  body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px; color: #1b1b1b; background: #f7eed7 url("assets/pulp-texture.jpg") center / cover; }
  .gate { width: min(100%, 560px); padding: clamp(30px, 7vw, 56px); background: #fbf6e9; border: 2px solid #e5dbc7; border-top: 10px solid #fcca29; border-radius: 22px; box-shadow: 0 24px 60px rgba(0, 95, 100, .18); }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; font: 400 40px/1 "Bebas Neue", Impact, sans-serif; letter-spacing: .14em; }
  .brand img { width: 44px; height: 44px; object-fit: contain; }
  .eyebrow { margin: 0 0 12px; color: #005f64; font: 500 22px/1 "Oswald", sans-serif; letter-spacing: .18em; text-transform: uppercase; }
  h1 { margin: 0; font: 400 72px/.95 "Bebas Neue", Impact, sans-serif; text-transform: uppercase; letter-spacing: .01em; }
  .copy { margin: 18px 0 30px; color: #3d3d3d; font-size: 18px; line-height: 1.5; }
  label { display: block; margin: 18px 0 8px; font: 500 22px/1 "Oswald", sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #005f64; }
  input { width: 100%; min-height: 52px; padding: 12px 16px; border: 2px solid #a9a9a9; border-radius: 12px; background: #fffdf7; color: #1b1b1b; font: inherit; font-size: 20px; }
  input:focus { outline: 3px solid rgba(103, 187, 192, .5); border-color: #008c94; }
  button { width: 100%; min-height: 54px; margin-top: 26px; border: 0; border-radius: 12px; background: #fcca29; color: #1b1b1b; font: 500 24px/1 "Oswald", sans-serif; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
  button:hover:not(:disabled) { background: #f0bb1a; }
  button:disabled { opacity: .6; cursor: wait; }
  #msg { min-height: 22px; margin: 14px 0 0; color: #d1283f; font-size: 17px; }
  #msg:empty { display: none; }
  .foot { margin: 30px 0 0; color: #686868; font-size: 16px; text-align: center; }
</style>
</head>
<body>
<main class="gate">
  <div class="brand"><img src="assets/logo-mark.png" alt="">ATOMICA</div>
  <p class="eyebrow">Acesso restrito</p>
  <h1>Diagnóstico Estratégico de IA<br>Sr. Jorge</h1>
  <p class="copy">Insira a senha fornecida pela Atomica para abrir a apresentação executiva.</p>
  <form id="gate-form" novalidate>
    <label for="pw">Senha</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <p id="msg" role="alert" aria-live="polite"></p>
    <button id="go" type="submit">Entrar</button>
  </form>
  <p class="foot">A apresentação é aberta somente após validar a senha.</p>
</main>
<script>
(() => {
  const form = document.getElementById('gate-form');
  const pw = document.getElementById('pw');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('go');
  const fromB64 = v => Uint8Array.from(atob(v), c => c.charCodeAt(0));

  async function decryptDeck(password) {
    const res = await fetch(new URL('presentation.enc', document.baseURI), { cache: 'no-store' });
    if (!res.ok) throw new Error('load');
    const p = await res.json();
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: fromB64(p.salt), iterations: p.iterations, hash: 'SHA-256' },
      material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(p.iv) }, key, fromB64(p.data));
    return new TextDecoder().decode(plain);
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    msg.textContent = '';
    if (!pw.value) { msg.textContent = 'Introduza a senha para continuar.'; return; }
    btn.disabled = true;
    btn.textContent = 'A validar…';
    try {
      const html = await decryptDeck(pw.value);
      const withBase = html.replace(/<head(\s[^>]*)?>/i, head => `${head}<base href="./">`);
      document.open();
      document.write(withBase);
      document.close();
    } catch (err) {
      msg.textContent = 'Senha inválida. Verifique e tente novamente.';
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
})();
</script>
</body>
</html>
